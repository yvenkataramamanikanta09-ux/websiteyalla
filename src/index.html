<!doctype html>
<html lang="{{LANG}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="theme-color" content="{{THEME_COLOR}}">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:type" content="website">
  {{OG_URL}}
  <title>{{TITLE}}</title>
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/reference.css">
  <script src="assets/js/app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="#top" id="brand">Portfolio</a>
    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menu</button>
    <nav id="site-nav" aria-label="Primary navigation"><ul id="nav-list"></ul></nav>
    <button class="theme-toggle" type="button" aria-label="Switch color theme">◐</button>
  </header>
  <main id="main"><div id="app" aria-live="polite"><p class="loading">Loading portfolio…</p></div></main>
  <footer><p id="footer-copy"></p></footer>
  <dialog id="project-dialog" aria-labelledby="dialog-title"><button class="dialog-close" type="button" aria-label="Close project details">×</button><div id="dialog-content"></div></dialog>
  <noscript><p class="error">JavaScript is required to load this portfolio’s JSON content.</p></noscript>
</body>
</html>
